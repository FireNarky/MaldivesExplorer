name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:validate-schema
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maldives_stage1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maldives_stage1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run test:migrations
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maldives_stage1
          AUTH_SECRET: ci-stage-1-auth-secret-32-characters
