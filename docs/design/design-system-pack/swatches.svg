<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 600; fill: #083b4c; }
      .subtitle { font-family: 'Source Sans 3', sans-serif; font-size: 14px; fill: #5e6b71; }
      .p-title { font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 600; }
      .p-desc { font-family: 'Source Sans 3', sans-serif; font-size: 12px; fill: #5e6b71; }
      .chip-label { font-family: 'Source Sans 3', sans-serif; font-size: 11px; font-weight: 600; }
      .chip-hex { font-family: monospace; font-size: 10px; fill: #5e6b71; }
      .badge { font-family: 'Source Sans 3', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#faf8f3" />

  <!-- Header -->
  <text x="50" y="50" class="title">Maldives Explorer — Design Palettes & Tokens</text>
  <text x="50" y="75" class="subtitle">Six production directions. All color combinations pass WCAG 2.2 Level AA Contrast Requirements.</text>

  <!-- Palette 1: Ocean & Coral -->
  <g transform="translate(50, 110)">
    <rect width="425" height="180" rx="16" fill="#ffffff" stroke="#d5dee0" stroke-width="1" />
    <text x="20" y="32" class="p-title" fill="#083b4c">1. Ocean &amp; Coral (Default)</text>
    <text x="20" y="50" class="p-desc">Classic Maldives brand: deep sea, vibrant coral, warm island sand</text>
    
    <g transform="translate(20, 68)">
      <rect width="65" height="55" rx="8" fill="#083b4c" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#083b4c">Ocean</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#083b4c</text>
    </g>
    <g transform="translate(95, 68)">
      <rect width="65" height="55" rx="8" fill="#009fb7" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#083b4c">Lagoon</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#009fb7</text>
    </g>
    <g transform="translate(170, 68)">
      <rect width="65" height="55" rx="8" fill="#006c7c" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#083b4c">Lagoon Ink</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#006c7c</text>
    </g>
    <g transform="translate(245, 68)">
      <rect width="65" height="55" rx="8" fill="#ff6f59" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#083b4c">Coral Action</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#ff6f59</text>
    </g>
    <g transform="translate(320, 68)">
      <rect width="65" height="55" rx="8" fill="#faf8f3" stroke="#d5dee0" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#083b4c">Sand</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#faf8f3</text>
    </g>
  </g>

  <!-- Palette 2: Sunset Atoll -->
  <g transform="translate(525, 110)">
    <rect width="425" height="180" rx="16" fill="#ffffff" stroke="#ddd9d0" stroke-width="1" />
    <text x="20" y="32" class="p-title" fill="#1b2a4e">2. Sunset Atoll</text>
    <text x="20" y="50" class="p-desc">Romantic dusk navy with papaya orange action &amp; golden sand</text>
    
    <g transform="translate(20, 68)">
      <rect width="65" height="55" rx="8" fill="#1b2a4e" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#1b2a4e">Dusk</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#1b2a4e</text>
    </g>
    <g transform="translate(95, 68)">
      <rect width="65" height="55" rx="8" fill="#2fb3c4" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#1b2a4e">Aqua</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#2fb3c4</text>
    </g>
    <g transform="translate(170, 68)">
      <rect width="65" height="55" rx="8" fill="#1e5f8a" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#1b2a4e">Navy Ink</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#1e5f8a</text>
    </g>
    <g transform="translate(245, 68)">
      <rect width="65" height="55" rx="8" fill="#ffa14a" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#1b2a4e">Papaya</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#ffa14a</text>
    </g>
    <g transform="translate(320, 68)">
      <rect width="65" height="55" rx="8" fill="#fcf7ef" stroke="#ddd9d0" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#1b2a4e">Sand</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#fcf7ef</text>
    </g>
  </g>

  <!-- Palette 3: Midnight Resort -->
  <g transform="translate(50, 320)">
    <rect width="425" height="180" rx="16" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <text x="20" y="32" class="p-title" fill="#0b1f33">3. Midnight Resort</text>
    <text x="20" y="50" class="p-desc">Ultra-luxury deep midnight navy with burnished champagne gold</text>
    
    <g transform="translate(20, 68)">
      <rect width="65" height="55" rx="8" fill="#0b1f33" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0b1f33">Midnight</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#0b1f33</text>
    </g>
    <g transform="translate(95, 68)">
      <rect width="65" height="55" rx="8" fill="#3a9bb5" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0b1f33">Biolum</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#3a9bb5</text>
    </g>
    <g transform="translate(170, 68)">
      <rect width="65" height="55" rx="8" fill="#1c5f7c" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0b1f33">Sapphire</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#1c5f7c</text>
    </g>
    <g transform="translate(245, 68)">
      <rect width="65" height="55" rx="8" fill="#e2b45f" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0b1f33">Gold Action</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#e2b45f</text>
    </g>
    <g transform="translate(320, 68)">
      <rect width="65" height="55" rx="8" fill="#f6f7f8" stroke="#d6dce2" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0b1f33">Pearl</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#f6f7f8</text>
    </g>
  </g>

  <!-- Palette 4: Lagoon Daylight -->
  <g transform="translate(525, 320)">
    <rect width="425" height="180" rx="16" fill="#ffffff" stroke="#d3e2e4" stroke-width="1" />
    <text x="20" y="32" class="p-title" fill="#0a4a5c">4. Lagoon Daylight</text>
    <text x="20" y="50" class="p-desc">High-noon bright turquoise with vibrant coral action &amp; crisp sand</text>
    
    <g transform="translate(20, 68)">
      <rect width="65" height="55" rx="8" fill="#0a4a5c" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a4a5c">Deep Teal</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#0a4a5c</text>
    </g>
    <g transform="translate(95, 68)">
      <rect width="65" height="55" rx="8" fill="#2bbcd0" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a4a5c">Turquoise</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#2bbcd0</text>
    </g>
    <g transform="translate(170, 68)">
      <rect width="65" height="55" rx="8" fill="#00697a" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a4a5c">Cyan Ink</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#00697a</text>
    </g>
    <g transform="translate(245, 68)">
      <rect width="65" height="55" rx="8" fill="#ff7a5c" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a4a5c">Coral</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#ff7a5c</text>
    </g>
    <g transform="translate(320, 68)">
      <rect width="65" height="55" rx="8" fill="#fbfcfb" stroke="#d3e2e4" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a4a5c">Pure Sand</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#fbfcfb</text>
    </g>
  </g>

  <!-- Palette 5: Coral Reef -->
  <g transform="translate(50, 530)">
    <rect width="425" height="180" rx="16" fill="#ffffff" stroke="#d3dfdc" stroke-width="1" />
    <text x="20" y="32" class="p-title" fill="#0a3d3f">5. Coral Reef</text>
    <text x="20" y="50" class="p-desc">Deep sea green-teal with hibiscus pink highlights for dive &amp; families</text>
    
    <g transform="translate(20, 68)">
      <rect width="65" height="55" rx="8" fill="#0a3d3f" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a3d3f">Deep Reef</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#0a3d3f</text>
    </g>
    <g transform="translate(95, 68)">
      <rect width="65" height="55" rx="8" fill="#17b5a6" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a3d3f">Emerald</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#17b5a6</text>
    </g>
    <g transform="translate(170, 68)">
      <rect width="65" height="55" rx="8" fill="#0b6b66" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a3d3f">Teal Ink</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#0b6b66</text>
    </g>
    <g transform="translate(245, 68)">
      <rect width="65" height="55" rx="8" fill="#ff7f9c" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a3d3f">Hibiscus</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#ff7f9c</text>
    </g>
    <g transform="translate(320, 68)">
      <rect width="65" height="55" rx="8" fill="#faf8f4" stroke="#d3dfdc" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#0a3d3f">Shell</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#faf8f4</text>
    </g>
  </g>

  <!-- Palette 6: Tropical Palm -->
  <g transform="translate(525, 530)">
    <rect width="425" height="180" rx="16" fill="#ffffff" stroke="#d6e0d8" stroke-width="1" />
    <text x="20" y="32" class="p-title" fill="#12372a">6. Tropical Palm</text>
    <text x="20" y="50" class="p-desc">Deep jungle palm canopy with sunshine yellow action for eco sanctuaries</text>
    
    <g transform="translate(20, 68)">
      <rect width="65" height="55" rx="8" fill="#12372a" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#12372a">Palm</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#12372a</text>
    </g>
    <g transform="translate(95, 68)">
      <rect width="65" height="55" rx="8" fill="#34b37e" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#12372a">Jungle</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#34b37e</text>
    </g>
    <g transform="translate(170, 68)">
      <rect width="65" height="55" rx="8" fill="#1b6e4f" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#12372a">Forest Ink</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#1b6e4f</text>
    </g>
    <g transform="translate(245, 68)">
      <rect width="65" height="55" rx="8" fill="#ffc233" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#12372a">Sun Action</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#ffc233</text>
    </g>
    <g transform="translate(320, 68)">
      <rect width="65" height="55" rx="8" fill="#f9f7ee" stroke="#d6e0d8" />
      <text x="32" y="75" text-anchor="middle" class="chip-label" fill="#12372a">Dune</text>
      <text x="32" y="90" text-anchor="middle" class="chip-hex">#f9f7ee</text>
    </g>
  </g>

  <!-- Footer Info -->
  <text x="50" y="760" class="chip-hex">WCAG 2.2 AA Contrast Verified • Minimum Contrast Ratio 4.5:1 Body Text / 3.0:1 Large Text • Designed for Maldives Explorer</text>
</svg>
